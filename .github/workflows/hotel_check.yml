name: Daily Niigata Hotel Monitor

on:
  schedule:
    # 每天 UTC 01:00 執行 (等於台灣時間 AM 09:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 支援手動觸發測試

jobs:
  check-hotels:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4   # 從 v3 升級至 v4

      - name: Set up Python
        uses: actions/setup-python@v5  # 從 v4 升級至 v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Hotel Check Script
        env:
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python check_hotels.py
